[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "lema-basic-web-server"
version = "0.1.0"
description = "A minimal educational HTTP web server written in Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Martin Lénárt" }
]

keywords = [
    "http",
    "web-server",
    "tcp",
    "socket",
    "networking",
    "educational",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]


[project.optional-dependencies]
dev = [
    "pytest",
]


[project.urls]
Homepage = "https://github.com/lema2000-dev/basic_web_server"
Repository = "https://github.com/lema2000-dev/basic_web_server"
Issues = "https://github.com/lema2000-dev/basic_web_server/issues"


[tool.setuptools.packages.find]
where = ["src"]
